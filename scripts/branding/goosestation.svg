<!-- GooseStation logo: the source the PNG, ICO and ICNS icons are rendered from. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C8DDB"/>
      <stop offset="1" stop-color="#1F4F9C"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FC4F2"/>
      <stop offset="1" stop-color="#4C9BE0"/>
    </linearGradient>
    <clipPath id="badge-clip">
      <rect x="24" y="24" width="464" height="464" rx="104"/>
    </clipPath>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#badge)"/>

  <g clip-path="url(#badge-clip)">
    <!-- Body -->
    <path d="M 92 352 C 92 286 160 250 236 258 C 286 263 318 292 344 326 C 380 372 360 418 296 424 L 150 424 C 112 424 92 394 92 352 Z" fill="#FAFAF5"/>
    <!-- Wing -->
    <path d="M 128 342 C 176 304 250 304 304 346 C 256 374 182 382 128 342 Z" fill="#D5DBE3"/>
    <path d="M 158 352 C 196 336 238 336 278 352" fill="none" stroke="#B9C2CE" stroke-width="8" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M 100 330 L 62 300 L 104 312 Z" fill="#FAFAF5"/>
    <!-- Neck -->
    <path d="M 282 304 C 262 248 262 210 302 168" fill="none" stroke="#FAFAF5" stroke-width="72" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="316" cy="152" r="50" fill="#FAFAF5"/>
    <!-- Beak -->
    <path d="M 352 128 C 386 128 416 140 434 154 C 416 162 386 172 354 174 Z" fill="#F5A623"/>
    <path d="M 354 154 C 382 156 410 156 434 154 C 416 162 386 172 354 174 Z" fill="#E0851A"/>
    <!-- Knob -->
    <circle cx="352" cy="128" r="15" fill="#E0851A"/>
    <!-- Eye -->
    <circle cx="324" cy="138" r="9" fill="#1A1F29"/>
    <circle cx="327" cy="135" r="3" fill="#FFFFFF"/>
    <!-- Water -->
    <path d="M 24 404 C 84 384 136 424 196 404 C 256 384 308 424 368 404 C 428 384 470 412 488 404 L 488 488 L 24 488 Z" fill="url(#water)"/>
    <path d="M 24 444 C 84 424 136 464 196 444 C 256 424 308 464 368 444 C 428 424 470 452 488 444 L 488 488 L 24 488 Z" fill="#3A86D1" opacity="0.6"/>
  </g>
</svg>
