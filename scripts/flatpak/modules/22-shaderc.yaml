name: shaderc
buildsystem: cmake-ninja
builddir: true
config-opts:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DSHADERC_SKIP_TESTS=ON"
  - "-DSHADERC_SKIP_EXAMPLES=ON"
  - "-DSHADERC_SKIP_COPYRIGHT_CHECK=ON"
build-options:
  strip: true
sources:
  - type: archive
    url: "https://github.com/stenzek/shaderc/archive/f60bb80e255144e71776e2ad570d89b78ea2ab4f.tar.gz"
    sha256: "4c1780b6c65c27c4dcb109f08ab632241c98b77fe2e22be726c151ff514482bf"
cleanup:
  - /bin
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
