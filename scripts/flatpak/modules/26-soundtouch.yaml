name: soundtouch
buildsystem: cmake-ninja
builddir: true
config-opts:
  - "-DCMAKE_BUILD_TYPE=Release"

  # Use clang with LTO for speed.
  - "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
  - "-DCMAKE_C_COMPILER=/usr/lib/sdk/llvm21/bin/clang"
  - "-DCMAKE_CXX_COMPILER=/usr/lib/sdk/llvm21/bin/clang++"
  - "-DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=lld"
  - "-DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=lld"
  - "-DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=lld"
build-options:
  strip: true
sources:
  - type: archive
    url: "https://github.com/stenzek/soundtouch/archive/463ade388f3a51da078dc9ed062bf28e4ba29da7.tar.gz"
    sha256: "fe45c2af99f6102d2704277d392c1c83b55180a70bfd17fb888cc84a54b70573"
cleanup:
  - /bin
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
  - /share
