name: Create rolling release

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'appveyor.yml'
      - 'scripts/*'
      - '.github/ISSUE_TEMPLATE/*'
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**.md'
      - 'appveyor.yml'
      - 'scripts/*'
      - '.github/ISSUE_TEMPLATE/*'
  # Pull requests can only restore caches saved on their own branch or on master, and GitHub evicts a
  # cache that goes unused for 7 days. Running on master twice a week keeps the dependency caches warm,
  # and rebuilds any that were evicted, so a PR after a quiet week does not rebuild every dependency.
  schedule:
    - cron: '0 4 * * 1,4'
  workflow_dispatch:

# A new push to a pull request cancels the run for its previous push. Branch pushes, schedules and
# manual runs each get their own group, so they are never cancelled or skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4.1.6
      with:
        fetch-depth: 0

    - name: Cache X64 Dependencies
      id: cache-deps-x64
      uses: actions/cache@v4
      with:
        path: dep/msvc/deps-x64
        key: deps-windows-x64 ${{ hashFiles('scripts/deps/build-dependencies-windows-x64.bat') }}

    - name: Build X64 Dependencies
      if: steps.cache-deps-x64.outputs.cache-hit != 'true'
      env:
        DEBUG: 0
      run: scripts/deps/build-dependencies-windows-x64.bat

    - name: Initialize build tag
      shell: cmd
      run: |
        echo #pragma once > src/scmversion/tag.h

    - name: Tag as preview build
      if: github.ref == 'refs/heads/master'
      shell: cmd
      run: |
        echo #define SCM_RELEASE_ASSET "goosestation-windows-x64-release.zip" >> src/scmversion/tag.h
        echo #define SCM_RELEASE_TAGS {"latest", "preview"} >> src/scmversion/tag.h
        echo #define SCM_RELEASE_TAG "preview" >> src/scmversion/tag.h

    - name: Tag as dev build
      if: github.ref == 'refs/heads/dev'
      shell: cmd
      run: |
        echo #define SCM_RELEASE_ASSET "goosestation-windows-x64-release.zip" >> src/scmversion/tag.h
        echo #define SCM_RELEASE_TAGS {"latest", "preview"} >> src/scmversion/tag.h
        echo #define SCM_RELEASE_TAG "latest" >> src/scmversion/tag.h

    - name: Update RC version fields
      shell: cmd
      run: |
        cd src\scmversion
        call update_rc_version.bat
        cd ..\..
        git update-index --assume-unchanged src/duckstation-qt/duckstation-qt.rc

    - name: Compile x64 release build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        msbuild duckstation.sln -t:Build -p:Platform=x64;Configuration=ReleaseLTCG-Clang

    - name: Create x64 symbols archive
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" a -r goosestation-windows-x64-release-symbols.zip ./bin/x64/*.pdb

    - name: Remove extra bloat before archiving
      shell: cmd
      run: |
        del /Q bin\x64\*.pdb bin\x64\*.exp bin\x64\*.lib bin\x64\*.iobj bin\x64\*.ipdb bin\x64\common-tests*
        rename bin\x64\updater-x64-ReleaseLTCG.exe updater.exe

    - name: Create x64 release archive
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" a -r goosestation-windows-x64-release.zip ./bin/x64/*

    - name: Upload x64 release artifact
      uses: actions/upload-artifact@v4.3.3
      with:
        name: "windows"
        path: "goosestation-windows-x64-release*.zip"


  windows-arm64-build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4.1.6
      with:
        fetch-depth: 0
        submodules: true

    # The ARM64 build also needs the x64 dependencies: Qt's host tools (moc, rcc, uic) run on the x64 runner.
    - name: Cache X64 Dependencies
      id: cache-deps-x64
      uses: actions/cache@v4
      with:
        path: dep/msvc/deps-x64
        key: deps-windows-x64 ${{ hashFiles('scripts/deps/build-dependencies-windows-x64.bat') }}

    # Keyed on the x64 script too, because the ARM64 Qt is built against the x64 host Qt.
    - name: Cache ARM64 Dependencies
      id: cache-deps-arm64
      uses: actions/cache@v4
      with:
        path: dep/msvc/deps-arm64
        key: deps-windows-arm64 ${{ hashFiles('scripts/deps/build-dependencies-windows-arm64.bat', 'scripts/deps/build-dependencies-windows-x64.bat') }}

    - name: Build X64 Dependencies
      if: steps.cache-deps-x64.outputs.cache-hit != 'true'
      env:
        DEBUG: 0
      run: scripts/deps/build-dependencies-windows-x64.bat

    - name: Build ARM64 Dependencies
      if: steps.cache-deps-arm64.outputs.cache-hit != 'true'
      env:
        DEBUG: 0
      run: scripts/deps/build-dependencies-windows-arm64.bat

    - name: Initialize build tag
      shell: cmd
      run: |
        echo #pragma once > src/scmversion/tag.h

    - name: Tag as preview build
      if: github.ref == 'refs/heads/master'
      shell: cmd
      run: |
        echo #define SCM_RELEASE_ASSET "goosestation-windows-arm64-release.zip" >> src/scmversion/tag.h
        echo #define SCM_RELEASE_TAGS {"latest", "preview"} >> src/scmversion/tag.h
        echo #define SCM_RELEASE_TAG "preview" >> src/scmversion/tag.h

    - name: Tag as dev build
      if: github.ref == 'refs/heads/dev'
      shell: cmd
      run: |
        echo #define SCM_RELEASE_ASSET "goosestation-windows-arm64-release.zip" >> src/scmversion/tag.h
        echo #define SCM_RELEASE_TAGS {"latest", "preview"} >> src/scmversion/tag.h
        echo #define SCM_RELEASE_TAG "latest" >> src/scmversion/tag.h

    - name: Update RC version fields
      shell: cmd
      run: |
        cd src\scmversion
        call update_rc_version.bat
        cd ..\..
        git update-index --assume-unchanged src/duckstation-qt/duckstation-qt.rc

    - name: Compile arm64 release build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" amd64_arm64
        msbuild duckstation.sln -t:Build -p:Platform=ARM64;Configuration=ReleaseLTCG-Clang

    - name: Create arm64 symbols archive
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" a -r goosestation-windows-arm64-release-symbols.zip ./bin/ARM64/*.pdb

    - name: Remove extra bloat before archiving
      shell: cmd
      run: |
        del /Q bin\ARM64\*.pdb bin\ARM64\*.exp bin\ARM64\*.lib bin\ARM64\*.iobj bin\ARM64\*.ipdb bin\ARM64\common-tests*
        rename bin\ARM64\updater-ARM64-ReleaseLTCG.exe updater.exe

    - name: Create arm64 release archive
      shell: cmd
      run: |
        "C:\Program Files\7-Zip\7z.exe" a -r goosestation-windows-arm64-release.zip ./bin/ARM64/*

    - name: Upload arm64 release artifact
      uses: actions/upload-artifact@v4.3.3
      with:
        name: "windows-arm64"
        path: "goosestation-windows-arm64-release*.zip"


  linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4.1.6
      with:
        fetch-depth: 0

    - name: Install packages
      shell: bash
      run: |
        # Workaround for https://github.com/actions/runner-images/issues/675
        scripts/retry.sh wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo scripts/retry.sh apt-add-repository -n 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main'

        sudo scripts/retry.sh apt-get update &&
        sudo scripts/retry.sh apt-get -y install \
          build-essential clang-21 cmake curl extra-cmake-modules git libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdecor-0-dev libegl-dev libevdev-dev \
          libfontconfig-dev libfreetype-dev libfuse2 libgtk-3-dev libgudev-1.0-dev libharfbuzz-dev libinput-dev libopengl-dev libpipewire-0.3-dev libpulse-dev \
          libssl-dev libudev-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-composite0-dev libxcb-cursor-dev libxcb-damage0-dev libxcb-glx0-dev \
          libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-present-dev libxcb-randr0-dev libxcb-render0-dev libxcb-render-util0-dev libxcb-shape0-dev \
          libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinput-dev libxcb-xkb-dev libxext-dev libxkbcommon-x11-dev libxrandr-dev lld-21 \
          llvm-21 nasm ninja-build patchelf pkg-config zlib1g-dev

    - name: Cache Dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: ~/deps
        key: deps ${{ hashFiles('scripts/deps/build-dependencies-linux.sh') }}

    - name: Build Dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: scripts/deps/build-dependencies-linux.sh "$HOME/deps"

    - name: Initialize build tag
      run: |
        echo '#pragma once' > src/scmversion/tag.h

    - name: Tag as preview build
      if: github.ref == 'refs/heads/master'
      run: |
        echo '#define SCM_RELEASE_ASSET "GooseStation-x64.AppImage"' >> src/scmversion/tag.h
        echo '#define SCM_RELEASE_TAGS {"latest", "preview"}' >> src/scmversion/tag.h
        echo '#define SCM_RELEASE_TAG "preview"' >> src/scmversion/tag.h

    - name: Tag as dev build
      if: github.ref == 'refs/heads/dev'
      run: |
        echo '#define SCM_RELEASE_ASSET "GooseStation-x64.AppImage"' >> src/scmversion/tag.h
        echo '#define SCM_RELEASE_TAGS {"latest", "preview"}' >> src/scmversion/tag.h
        echo '#define SCM_RELEASE_TAG "latest"' >> src/scmversion/tag.h


    - name: Compile build
      shell: bash
      run: |
        mkdir build
        cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_PREFIX_PATH="$HOME/deps" -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" -DCMAKE_MODULE_LINKER_FLAGS_INIT="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" ..
        cmake --build . --parallel
        cd ..
        scripts/appimage/make-appimage.sh $(realpath .) $(realpath ./build) $HOME/deps GooseStation-x64

    - name: Upload Qt AppImage
      uses: actions/upload-artifact@v4.3.3
      with:
        name: "linux-x64-appimage-qt"
        path: "GooseStation-x64.AppImage"


  linux-flatpak-build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4.1.6
      with:
        fetch-depth: 0
        set-safe-directory: ${{ env.GITHUB_WORKSPACE }}

    # Work around container ownership issue
    - name: Set Safe Directory
      shell: bash
      run: git config --global --add safe.directory "*"

    - name: Initialize build tag
      run: |
        echo '#pragma once' > src/scmversion/tag.h

    - name: Generate AppStream XML
      run: |
        scripts/generate-metainfo.sh scripts/flatpak
        cat scripts/flatpak/io.github.ilyalissoboi.GooseStation.metainfo.xml

    - name: Validate AppStream XML
      run: flatpak-builder-lint appstream scripts/flatpak/io.github.ilyalissoboi.GooseStation.metainfo.xml

    - name: Validate manifest
      run: flatpak-builder-lint manifest scripts/flatpak/io.github.ilyalissoboi.GooseStation.yaml

    # Built as a bundle only. Not published to Flathub, so there is no screenshot mirroring and no
    # `flatpak-builder-lint repo` (it enforces Flathub's publishing rules: mirrored media, screenshots).
    - name: Build Flatpak
      uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
      with:
        bundle: goosestation-x64.flatpak
        upload-artifact: false
        manifest-path: scripts/flatpak/io.github.ilyalissoboi.GooseStation.yaml
        arch: x86_64
        build-bundle: true
        verbose: true
        branch: stable
        cache: true
        restore-cache: true
        cache-key: flatpak-x64-${{ hashFiles('scripts/flatpak/**/*.yaml') }}

    - name: Upload Flatpak
      uses: actions/upload-artifact@v4.3.3
      with:
        name: "linux-flatpak"
        path: "goosestation-x64.flatpak"


  macos-build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4.1.6
      with:
        fetch-depth: 0

    # Qt 6.12 needs Xcode 16 (the macOS 15 SDK).
    - name: Use Xcode 16.4
      run: sudo xcode-select -s /Applications/Xcode_16.4.app

    - name: Install packages
      shell: bash
      run: |
        brew install curl ninja

    - name: Cache Dependencies
      id: cache-deps-mac
      uses: actions/cache@v4
      with:
        path: ~/deps
        key: deps-mac ${{ hashFiles('scripts/deps/build-dependencies-mac.sh') }}

    - name: Build Dependencies
      if: steps.cache-deps-mac.outputs.cache-hit != 'true'
      run: scripts/deps/build-dependencies-mac.sh "$HOME/deps"

    - name: Initialize build tag
      run: |
        echo '#pragma once' > src/scmversion/tag.h

    - name: Tag as preview build
      if: github.ref == 'refs/heads/master'
      run: |
        echo '#define SCM_RELEASE_ASSET "goosestation-mac-release.zip"' >> src/scmversion/tag.h
        echo '#define SCM_RELEASE_TAGS {"latest", "preview"}' >> src/scmversion/tag.h
        echo '#define SCM_RELEASE_TAG "preview"' >> src/scmversion/tag.h

    - name: Tag as dev build
      if: github.ref == 'refs/heads/dev'
      run: |
        echo '#define SCM_RELEASE_ASSET "goosestation-mac-release.zip"' >> src/scmversion/tag.h
        echo '#define SCM_RELEASE_TAGS {"latest", "preview"}' >> src/scmversion/tag.h
        echo '#define SCM_RELEASE_TAG "latest"' >> src/scmversion/tag.h

    - name: Compile and zip .app
      shell: bash
      run: |
        mkdir build
        cd build
        export MACOSX_DEPLOYMENT_TARGET=14.4
        cmake -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_BUILD_TYPE=Release -DENABLE_OPENGL=OFF -DCMAKE_PREFIX_PATH="$HOME/deps" -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -G Ninja ..
        cmake --build . --parallel
        mv bin/GooseStation.app .
        codesign -s - --deep -f -v GooseStation.app
        zip -r goosestation-mac-release.zip GooseStation.app/

    - name: Upload macOS .app
      uses: actions/upload-artifact@v4.3.3
      with:
        name: "macos"
        path: "build/goosestation-mac-release.zip"


  create-release:
    needs: [windows-build, windows-arm64-build, linux-build, linux-flatpak-build, macos-build]
    runs-on: ubuntu-22.04
    # Releases are published by hand only (Actions > Create rolling release > Run workflow, on master or dev). Most pushes
    # in this stage of development are work in progress, and a release for each would bury the ones worth installing.
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0

      # The builds took their version from the same annotated tag (see docs/releasing.md). Without one they would all
      # report an empty version, so nothing is published.
      - name: Get version
        id: version
        run: |
          if ! VERSION=$(git describe); then
            echo "::error::No annotated version tag (such as 0.1) is reachable from this commit, see docs/releasing.md."
            exit 1
          fi
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          path: ./artifacts/

      - name: Display Downloaded Artifacts
        run: find ./artifacts/

      # Each channel is a single release whose tag the updater follows: master publishes "preview", dev "latest". The
      # release is replaced and its tag moved to this commit, so the history holds one release per channel. The channel
      # tags are lightweight, so git describe never picks them up as versions.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAG=preview
            TITLE="Preview ${VERSION}"
            PRERELEASE=--prerelease
          else
            TAG=latest
            TITLE="Rolling release ${VERSION}"
            PRERELEASE=
          fi

          gh release delete "${TAG}" --yes || true
          git push origin ":refs/tags/${TAG}" || true

          gh release create "${TAG}" ${PRERELEASE} --target "${GITHUB_SHA}" --title "${TITLE}" \
            --notes "GooseStation ${VERSION}, built from ${GITHUB_SHA}." \
            ./artifacts/windows/goosestation-windows-x64-release.zip \
            ./artifacts/windows/goosestation-windows-x64-release-symbols.zip \
            ./artifacts/windows-arm64/goosestation-windows-arm64-release.zip \
            ./artifacts/windows-arm64/goosestation-windows-arm64-release-symbols.zip \
            ./artifacts/linux-x64-appimage-qt/GooseStation-x64.AppImage \
            ./artifacts/linux-flatpak/goosestation-x64.flatpak \
            ./artifacts/macos/goosestation-mac-release.zip
