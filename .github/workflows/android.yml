name: Android build

# Builds the debug APK and runs the JVM tests and the Kotlin checks. It has no secrets, and isn't part of a release.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'dep/**'
      - 'CMakeModules/**'
      - 'CMakeLists.txt'
      - 'data/resources/**'
      - 'scripts/deps/build-dependencies-android.sh'
      - '.github/workflows/android.yml'
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - 'src/**'
      - 'dep/**'
      - 'CMakeModules/**'
      - 'CMakeLists.txt'
      - 'data/resources/**'
      - 'scripts/deps/build-dependencies-android.sh'
      - '.github/workflows/android.yml'
  # As in rolling-release.yml: running on master twice a week keeps the dependency cache from being evicted.
  schedule:
    - cron: '0 4 * * 1,4'
  workflow_dispatch:

# A new push to a pull request cancels the run for its previous push. Branch pushes, schedules and
# manual runs each get their own group, so they are never cancelled or skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# It only reads the repository.
permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    # The whole history, for the version stamp (git describe).
    - uses: actions/checkout@v4.1.6
      with:
        fetch-depth: 0

    # NDK_VERSION, CMAKE_VERSION, BUILD_TOOLS_VERSION and EMUSYNC_VERSION, from the version catalog Gradle reads.
    - name: Read the toolchain versions
      run: python3 android/scripts/toolchain-versions.py >> "$GITHUB_ENV"

    # The instrumented tests' runner can't run here (no emulator), but its lock, step limit and emulator wait can,
    # against a fake adb.
    - name: Test the scripts
      run: |
        bash android/scripts/tests/test-emulator-run-lib.sh
        python3 -m unittest android/scripts/tests/test_toolchain_versions.py

    - name: Set up JDK 17
      uses: actions/setup-java@v4.9.1
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4.4.4

    # The SDK's CMake package brings Ninja too: the dependency build uses the same CMake and Ninja as Gradle's.
    - name: Install the NDK, CMake and the platform
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
          "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-37.0" "build-tools;$BUILD_TOOLS_VERSION"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin" >> "$GITHUB_PATH"

    # Restored here and saved as soon as they're built, so a later step's failure doesn't throw the build away.
    - name: Restore the Android dependencies
      id: cache-deps
      uses: actions/cache/restore@v4
      with:
        path: ~/deps-android
        key: deps-android-ndk${{ env.NDK_VERSION }} ${{ hashFiles('scripts/deps/build-dependencies-android.sh') }}

    - name: Build the Android dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: scripts/deps/build-dependencies-android.sh "$HOME/deps-android"

    - name: Save the Android dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/deps-android
        key: ${{ steps.cache-deps.outputs.cache-primary-key }}

    # Through GitHub's API with the job's token, into the copy the build takes before downloading (dep/emusync/):
    # github.com's release links answer 504 to logged-out requests now and then, when the API still works. The build
    # checks its SHA-256 as ever. The version is the build's own, from the catalog.
    - name: Fetch emusync's Android library
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download "v$EMUSYNC_VERSION" --repo ilyalissoboi/emusync --pattern "emusync-$EMUSYNC_VERSION.aar" \
          --dir dep/emusync

    # The instrumented tests need an emulator, which CI hasn't: they're built here, so a change they no longer compile
    # against fails the pull request rather than the next local run.
    - name: Build the APK and the instrumented tests, and run the JVM tests, the Kotlin checks and Lint
      working-directory: android
      run: |
        export GOOSESTATION_ANDROID_DEPS="$HOME/deps-android"
        ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest ktlintCheck checkNoWindowDialogs lintDebug \
          :build-logic:test

    - name: Upload the debug APK
      uses: actions/upload-artifact@v4.3.3
      with:
        name: android-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    # Lint fails the build only on an error; its warnings are here, readable without a build.
    - name: Upload the Lint report
      if: always()
      uses: actions/upload-artifact@v4.3.3
      with:
        name: android-lint-report
        path: android/app/build/reports/lint-results-debug.html
        if-no-files-found: ignore
