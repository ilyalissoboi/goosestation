name: cpuinfo
buildsystem: cmake-ninja
builddir: true
config-opts:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCPUINFO_LIBRARY_TYPE=shared"
  - "-DCPUINFO_RUNTIME_TYPE=shared"
  - "-DCPUINFO_LOG_LEVEL=error"
  - "-DCPUINFO_LOG_TO_STDIO=ON"
  - "-DCPUINFO_BUILD_TOOLS=OFF"
  - "-DCPUINFO_BUILD_UNIT_TESTS=OFF"
  - "-DCPUINFO_BUILD_MOCK_TESTS=OFF"
  - "-DCPUINFO_BUILD_BENCHMARKS=OFF"
  - "-DUSE_SYSTEM_LIBS=ON"
build-options:
  strip: true
sources:
  - type: archive
    url: "https://github.com/stenzek/cpuinfo/archive/7524ad504fdcfcf75a18a133da6abd75c5d48053.tar.gz"
    sha256: "e1351218d270db49c3dddcba04fb2153b09731ea3fa6830e423f5952f44585be"
cleanup:
  - /bin
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
  - /share
