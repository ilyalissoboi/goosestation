# Every platform GooseStation builds librashader for.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "aarch64-linux-android",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MIT-0",
  "NCSA",
  "OFL-1.1",
  "LicenseRef-UFL-1.0",
  "GPL-3.0",
]
