app-id: "io.github.ilyalissoboi.GooseStation"
runtime: "org.kde.Platform"
runtime-version: "6.7"
sdk: "org.kde.Sdk"
sdk-extensions:
  - "org.freedesktop.Sdk.Extension.llvm17"
add-extensions:
  "org.freedesktop.Platform.ffmpeg-full":
    directory: "lib/ffmpeg"
    version: "23.08"
    add-ld-path: "."
    autodownload: true

command: "goosestation-qt"

finish-args:
  - "--device=all"
  - "--allow=bluetooth"
  - "--share=network"
  - "--share=ipc"
  - "--socket=pulseaudio"
  - "--talk-name=org.freedesktop.ScreenSaver"

  # Wayland is disabled due to various QtWayland issues, causing broken UI.
  - "--socket=x11"
  - "--env=QT_QPA_PLATFORM=xcb"

modules:
  # Dependencies.
  - "modules/20-sdl2.yaml"
  - "modules/21-libbacktrace.yaml"
  - "modules/22-shaderc.yaml"
  - "modules/23-spirv-cross.yaml"
  - "modules/24-cpuinfo.yaml"
  - "modules/25-discord-rpc.yaml"
  - "modules/26-soundtouch.yaml"
  - "modules/27-lunasvg.yaml"

  # Main module.
  - name: goosestation
    buildsystem: cmake-ninja
    builddir: true
    no-make-install: true
    build-options:
      # Preserve debug information, it is needed for backtraces.
      strip: false
      no-debuginfo: true

      # Prevent flatpak defaults of fortify etc from creeping in.
      cflags: ""
      cflags-override: true
      cxxflags: ""
      cxxflags-override: true

      config-opts:
        # Flatpak build does not appear to default to Release.
        - "-DCMAKE_BUILD_TYPE=Release"

        # We're not running tests as part of the flatpak build.
        - '-DBUILD_TESTS=OFF'

        # Make sure we're using ThinLTO.
        - "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
        - "-DCMAKE_C_COMPILER=/usr/lib/sdk/llvm17/bin/clang"
        - "-DCMAKE_CXX_COMPILER=/usr/lib/sdk/llvm17/bin/clang++"
        - "-DCMAKE_EXE_LINKER_FLAGS_INIT=-fuse-ld=lld"
        - "-DCMAKE_MODULE_LINKER_FLAGS_INIT=-fuse-ld=lld"
        - "-DCMAKE_SHARED_LINKER_FLAGS_INIT=-fuse-ld=lld"
    sources:
      - type: dir
        path: ../..
      # Memory card sync: the pinned emusync release that CMakeModules/EmuSync.cmake would download,
      # fetched here because the build itself has no network.
      - type: file
        url: "https://github.com/ilyalissoboi/emusync/releases/download/v0.3.0/emusync-0.3.0-linux-x86_64.tar.gz"
        sha256: "395f0098c8f622941fd4cea6592fa873902df3b46fafd06e58269786322b5e6a"
        dest: dep/emusync

    post-install:
      # Copy the binary distribution.
      - "cp -a bin \"${FLATPAK_DEST}\""

      # Manually copy desktop file/metadata, it's not done as part of the regular build.
      - >-
        install -Dm644
        "${FLATPAK_BUILDER_BUILDDIR}/scripts/io.github.ilyalissoboi.GooseStation.png"
        "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.ilyalissoboi.GooseStation.png"
      - >-
        install -Dm644
        "${FLATPAK_BUILDER_BUILDDIR}/scripts/io.github.ilyalissoboi.GooseStation.desktop"
        "${FLATPAK_DEST}/share/applications/io.github.ilyalissoboi.GooseStation.desktop"
      - >-
        install -Dm644
        "${FLATPAK_BUILDER_BUILDDIR}/scripts/flatpak/io.github.ilyalissoboi.GooseStation.metainfo.xml"
        "${FLATPAK_DEST}/share/metainfo/io.github.ilyalissoboi.GooseStation.metainfo.xml"

      # Ensure ffmpeg-full mount point exists.
      - "mkdir -p \"${FLATPAK_DEST}/lib/ffmpeg\""
