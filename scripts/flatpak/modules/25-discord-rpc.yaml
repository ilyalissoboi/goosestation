name: discord-rpc
buildsystem: cmake-ninja
builddir: true
config-opts:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED_LIBS=ON"
build-options:
  strip: true
sources:
  - type: archive
    url: "https://github.com/stenzek/discord-rpc/archive/144f3a3f1209994d8d9e8a87964a989cb9911c1e.tar.gz"
    sha256: "3eea5ccce6670c126282f1ba4d32c19d486db49a1a5cbfb8d6f48774784d310c"
cleanup:
  - /bin
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
  - /share
